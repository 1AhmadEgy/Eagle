schema_version: "1.0"
suite: identity-trust-v1
purpose: >
  Security scenario definitions for pairing, trust state transitions,
  revocation, identity change and recovery boundaries. These scenarios
  become executable integration tests when the protocol/key-management
  adapters are frozen.

scenarios:
  - id: IT-SC-001
    name: pending-device-self-promotion
    preconditions:
      device_state: PENDING
    action: start-protected-session
    expected: DENY
    invariant: I-03

  - id: IT-SC-002
    name: explicit-pairing-approval
    preconditions:
      device_state: PENDING
      pairing: ACTIVE
      account_binding: MATCH
    action: approve-device
    expected: TRUSTED
    invariant: I-03

  - id: IT-SC-003
    name: pairing-replay
    preconditions:
      pairing: CONSUMED
    action: approve-device
    expected: DENY
    invariant: I-04

  - id: IT-SC-004
    name: pairing-expiry
    preconditions:
      pairing: EXPIRED
    action: approve-device
    expected: DENY
    invariant: I-04

  - id: IT-SC-005
    name: pairing-account-mismatch
    preconditions:
      pairing_account: A
      requested_account: B
    action: approve-device
    expected: DENY
    invariant: I-05

  - id: IT-SC-006
    name: stale-trust-epoch
    preconditions:
      device_state: TRUSTED
      observed_epoch: STALE
    action: start-protected-session
    expected: DENY
    invariant: I-09

  - id: IT-SC-007
    name: revoked-device
    preconditions:
      device_state: REVOKED
    action: start-protected-session
    expected: DENY
    invariant: I-08

  - id: IT-SC-008
    name: identity-key-change
    preconditions:
      contact_state: VERIFIED
      identity_key: CHANGED
    action: accept-new-key
    expected: QUARANTINE_UNTIL_REVERIFIED
    invariant: I-10

  - id: IT-SC-009
    name: account-recovery-without-data-recovery
    preconditions:
      account_recovery: VALID
      data_recovery_material: ABSENT
    action: recover-history
    expected: DENY
    invariant: I-11

  - id: IT-SC-010
    name: attestation-does-not-create-trust
    preconditions:
      platform_assurance: PLATFORM_ATTESTED
      membership_state: UNKNOWN
    action: start-protected-session
    expected: DENY
    invariant: I-12

  - id: IT-SC-011
    name: revoked-device-cannot-reactivate
    preconditions:
      device_state: REVOKED
    action: reinstate
    expected: DENY
    invariant: I-08

  - id: IT-SC-012
    name: cancelled-pairing-cannot-resume
    preconditions:
      pairing: CANCELLED
    action: approve-device
    expected: DENY
    invariant: I-04

  - id: IT-SC-013
    name: pairing-device-mismatch
    preconditions:
      pairing_device: OTHER_DEVICE
      requested_device: TARGET_DEVICE
    action: approve-device
    expected: DENY
    invariant: I-05

  - id: IT-SC-014
    name: rejected-pairing-approval
    preconditions:
      device_state: PENDING
      pairing: ACTIVE
      approval_evidence: REJECTED
    action: approve-device
    expected: DENY
    invariant: I-03

  - id: IT-SC-015
    name: identity-reverification-rejected
    preconditions:
      contact_state: QUARANTINED
      pending_identity: PRESENT
      reverification: REJECTED
    action: reverify
    expected: DENY_AND_REMAIN_QUARANTINED
    invariant: I-10

  - id: IT-SC-016
    name: identity-reverification-candidate-mismatch
    preconditions:
      contact_state: QUARANTINED
      pending_identity: A
      presented_identity: B
    action: reverify
    expected: DENY_AND_REMAIN_QUARANTINED
    invariant: I-10

  - id: IT-SC-017
    name: cross-account-device-reuse
    preconditions:
      device_binding_account: A
      requested_account: B
    action: bind-device
    expected: DENY
    invariant: I-05

  - id: IT-SC-018
    name: duplicate-device-binding
    preconditions:
      device_binding: ALREADY_PRESENT
    action: bind-device
    expected: DENY
    invariant: I-05

  - id: IT-SC-019
    name: recovery-history-separation
    preconditions:
      account_recovery: VALID
      data_recovery_material: ABSENT
    action: recover-history
    expected: DENY
    invariant: I-11

deferred_protocol_cases:
  - transcript-tampering
  - identity-signature-forgery
  - cross-account-replay
  - concurrent-device-approval-race
  - offline-revocation-convergence
  - serialization-downgrade
  - persistent-state-rollback
  - cross-platform-interoperability
