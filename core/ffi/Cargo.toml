[package]
name = "eagle-core-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "eagle_core_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
eagle-core = { path = ".." }
uniffi = { version = "=0.32.1", features = ["cli"] }
