name: CI

on:
  push:
    branches:
      - main
      - implementation/**
      - legal/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository and test verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test ! -e .env
          test ! -e .env.production
          test ! -e .env.local
          test ! -e .env.test
          echo "Repository baseline checks passed."

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify security policy boundaries
        shell: bash
        run: python3 scripts/ci/verify-security-policy.py

      - name: Verify architecture security boundaries
        shell: bash
        run: python3 scripts/ci/verify-architecture-boundaries.py

      - name: Discover product surface
        shell: bash
        run: python3 scripts/ci/discover-product-surface.py

      - name: Run project verification and Test Lab categories
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .ci/testlab
          bash scripts/ci/verify.sh 2>&1 | tee .ci/testlab/verify.log
          baseline_rc=${PIPESTATUS[0]}

          python3 scripts/ci/run-testlab-categories.py
          category_rc=$?

          BASELINE_RC="$baseline_rc" CATEGORY_RC="$category_rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".ci/testlab/categories.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["commit"] = os.environ["GITHUB_SHA"]
          data["ref"] = os.environ["GITHUB_REF"]
          data["workflow"] = os.environ["GITHUB_WORKFLOW"]
          data["run_id"] = os.environ["GITHUB_RUN_ID"]
          path.write_text(json.dumps(data, indent=2) + "\\n", encoding="utf-8")

          # Keep the legacy exact-SHA status contract while exposing concrete
          # category evidence separately in categories.json.
          baseline_rc = int(os.environ["BASELINE_RC"])
          category_rc = int(os.environ["CATEGORY_RC"])
          status = {
              "schema_version": "1.0",
              "project": "Eagle",
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "timestamp_utc": data["timestamp_utc"],
              "verification": "PASS" if baseline_rc == 0 and category_rc == 0 else "FAIL",
              "categories": {
                  name: item["status"]
                  for name, item in data["categories"].items()
              },
              "gate": data["gate"],
              "gate_reason": data.get("gate_reason", "")
          }
          Path(".ci/testlab/status.json").write_text(
              json.dumps(status, indent=2) + "\\n", encoding="utf-8"
          )
          PY

          if [[ "$baseline_rc" -ne 0 || "$category_rc" -ne 0 ]]; then
            exit 1
          fi

          echo "verification=PASS" >> "$GITHUB_OUTPUT"

      - name: Upload Test Lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testlab-${{ github.sha }}
          path: .ci/testlab/
          if-no-files-found: warn
          retention-days: 30
