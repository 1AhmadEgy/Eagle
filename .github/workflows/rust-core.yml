name: Rust Core

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "core/**"
      - ".github/workflows/rust-core.yml"
  push:
    branches: [main, "execution/**"]
    paths:
      - "Cargo.toml"
      - "core/**"
      - ".github/workflows/rust-core.yml"

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # reviewed upstream commit
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@66b1e9526150e74ddd7e4190356facd783fb3b44 # reviewed upstream commit
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
