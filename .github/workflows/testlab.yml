name: Eagle Test Lab

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: Build + Unit + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-37"
          test -x "$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: gradle :app:lint --no-daemon --console=plain

      - name: Debug build
        run: gradle :app:assembleDebug --no-daemon --console=plain
