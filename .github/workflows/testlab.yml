name: Eagle Test Lab

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: Build + Unit + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.6.0"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android 37 SDK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --list | grep -E "platforms;android-37|build-tools;37\." || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: gradle :app:lint --no-daemon --console=plain

      - name: Debug build
        run: gradle :app:assembleDebug --no-daemon --console=plain
