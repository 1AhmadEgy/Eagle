name: Eagle Test Lab

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verification:
    name: Build + Unit + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Accept SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 37
        run: "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: gradle :app:lint --no-daemon --console=plain

      - name: Debug build
        run: gradle :app:assembleDebug --no-daemon --console=plain
